name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 線上對戰伺服器（Render）的網址存在 repository variable SERVER_URL，
      # 佈署時才寫進 public/js/config.js，不進版控。
      - name: Inject server URL
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: node scripts/inject-server-url.js

      - name: Upload public/ as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
